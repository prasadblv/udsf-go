services:
  redis_bp:
    image: redis:7.2.4
    restart: unless-stopped
    # Keep Redis below the container limit so it errors on writes instead of being OOM-killed.
    command: ["redis-server", "--maxmemory", "400mb", "--maxmemory-policy", "noeviction"]
    networks:
      - udsf_net
    deploy:
      resources:
        limits:
          cpus: "${REDIS_CPUS:-2.0}"
          memory: "${REDIS_MEMORY:-1024m}"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  udsf:
    build: .
    networks:
      - udsf_net
    image: udsf:latest
    restart: unless-stopped
    depends_on:
      redis_bp:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "${UDSF_CPUS:-1.0}"
          memory: "${UDSF_MEMORY:-1g}"
    ports:
      - "${UDSF_PORT:-9443}:9443"
    environment:
      UDSF_SERVER_HTTPS_PORT: ":9443"
      UDSF_SERVER_CERT_PEM_LOCATION: /certs/server.pem
      UDSF_SERVER_CERT_KEY_LOCATION: /certs/server.key
      UDSF_SERVER_MODE: release
      UDSF_CONFIG: /config/udsf_config.yaml
      UDSF_REDIS_HOST: redis_bp
      UDSF_REDIS_PORT: "6379"
      UDSF_REDIS_PASSWORD: ""
      UDSF_REDIS_DATABASE: "1"
      UDSF_LOG_FILE: "${UDSF_LOG_FILE:-}" # empty = stdout only (view with docker logs)
    volumes:
      # Generate with ./generate-cert.sh first
      - ./certs:/certs:ro
      - ./config:/config:ro

networks:
  udsf_net:
    name: udsf_net
    driver: bridge
