services:
  redis_bp:
    image: redis:7.2.4
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "400mb", "--maxmemory-policy", "noeviction"]
    networks:
      - udsf_net
    deploy:
      resources:
        limits:
          cpus: "${REDIS_CPUS:-2.0}"
          memory: "${REDIS_MEMORY:-1024m}"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  victoria-metrics:
    image: victoriametrics/victoria-metrics:v1.102.1
    restart: unless-stopped
    command:
      - "-storageDataPath=/victoria-metrics-data"
      - "-retentionPeriod=${VM_RETENTION:-1}"
      - "-httpListenAddr=:8428"
      - "-opentelemetry.usePrometheusNaming=true"
    ports:
      - "${VM_PORT:-8428}:8428" # UI (/vmui) and query API
    volumes:
      - vm_data:/victoria-metrics-data
    networks:
      - udsf_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8428/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  victoria-traces:
    image: victoriametrics/victoria-traces:v0.13.0
    restart: unless-stopped
    command:
      - "-storageDataPath=/victoria-traces-data"
      - "-retentionPeriod=${VT_RETENTION:-7d}"
      - "-httpListenAddr=:10428"
    ports:
      - "${VT_PORT:-10428}:10428" # UI (/select/vmui) and Jaeger query API (/select/jaeger)
    volumes:
      - vt_data:/victoria-traces-data
    networks:
      - udsf_net
    # No healthcheck: the image has no wget/curl to probe with.

  victoria-logs:
    image: victoriametrics/victoria-logs:v1.28.0
    restart: unless-stopped
    command:
      - "-storageDataPath=/victoria-logs-data"
      - "-retentionPeriod=${VL_RETENTION:-7d}"
      - "-httpListenAddr=:9428"
    ports:
      - "${VL_PORT:-9428}:9428" # UI (/select/vmui) and query API (/select/logsql/query)
    volumes:
      - vl_data:/victoria-logs-data
    networks:
      - udsf_net
    # No healthcheck: the image has no wget/curl to probe with.

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      victoria-metrics:
        condition: service_healthy
      victoria-traces:
        condition: service_started
      victoria-logs:
        condition: service_started
    networks:
      - udsf_net

  udsf:
    build: .
    networks:
      - udsf_net
    image: udsf:latest
    command: ["-config", "/config/udsf_config.docker.yaml"]
    restart: unless-stopped
    depends_on:
      redis_bp:
        condition: service_healthy
      otel-collector:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "${UDSF_CPUS:-1.0}"
          memory: "${UDSF_MEMORY:-1g}"
    ports:
      - "${UDSF_PORT:-9443}:9443"
    volumes:
      # Generate with ./generate-cert.sh first
      - ./certs:/certs:ro
      - ./config:/config:ro

volumes:
  vm_data:
  vt_data:
  vl_data:

networks:
  udsf_net:
    name: udsf_net
    driver: bridge
